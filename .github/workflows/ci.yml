name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and publish, e.g. v1.0.0'
        required: true

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Translations complete
        run: for lang in de es nb pl uk; do php bin/i18n-strings.php $lang || exit 1; done

      - name: Shell scripts syntax
        run: sh -n deploy/install.sh && sh -n deploy/docker/entrypoint.sh

  # Builds and validates the image; after the tests pass it is published to
  # ghcr.io: master -> latest, tag v1.2.3 -> 1.2.3 + latest,
  # manual run with a tag -> that version only.
  docker:
    needs: php
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: release
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.tag || github.ref_name }}
          FULL_REF: ${{ github.ref }}
        run: |
          if [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = workflow_dispatch ]; then
            echo "::error::'$REF' is not a vX.Y.Z tag"; exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ] || { [ "$EVENT" = push ] && [[ "$FULL_REF" == refs/heads/master || "$FULL_REF" == refs/tags/v* ]]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: php-virt-manager
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate nginx and php-fpm config
        run: |
          docker run --rm --entrypoint sh php-virt-manager -c \
            '/app/deploy/docker/entrypoint.sh true && nginx -t && php-fpm8.5 -t && php -m | grep -q libvirt'

      - if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: steps.release.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag php-virt-manager "$tag"
            docker push "$tag"
          done
